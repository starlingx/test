storageClasses:
  - name: csi-powerstore-iscsi
    arrayID: "{{ array_id }}"
    fstype: ext4
    allowVolumeExpansion: false
    nasName: "{{ nas_name }}"

secret:
  arrays:
    - globalID: "{{ array_id }}"
      username: "{{ username }}"
      password: "{{ password }}"
      endpoint: "{{ endpoint }}"
      isDefault: true
      blockProtocol: "ISCSI"
