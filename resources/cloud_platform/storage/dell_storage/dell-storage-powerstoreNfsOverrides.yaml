storageClasses:
  - name: csi-powerstore-nfs
    arrayID: "{{ array_id }}"
    fstype: nfs
    nasName: "{{ nas_name }}"

secret:
  arrays:
    - globalID: "{{ array_id }}"
      username: "{{ username }}"
      password: "{{ password }}"
      endpoint: "{{ endpoint }}"
      isDefault: true
      nasName: "{{ nas_name }}"
      blockProtocol: "None"
