apiVersion: v1
kind: Pod
metadata:
  name: lvm-pod-cgts-vg
spec:
  # cgts-vg lives on the controller(s); tolerate the control-plane taint and target a
  # control-plane node so this pod schedules on both STD (dedicated workers) and AIO labs.
  tolerations:
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  shareProcessNamespace: true
  restartPolicy: Always
  containers:
    - name: lvm-pod-cgts-vg
      image: busybox:1.37
      command:
        - /bin/sh
        - -c
        - |
          dd if=/dev/urandom of=/mnt1/foo bs=1M count=233 conv=fsync
          while :; do
            date
            sleep 10
          done
      volumeMounts:
        - mountPath: /mnt1
          name: pvc1
  volumes:
    - name: pvc1
      persistentVolumeClaim:
        claimName: lvm-pvc-cgts-vg
