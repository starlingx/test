apiVersion: v1
kind: Pod
metadata:
  name: dummy-numa-test
  namespace: default
spec:
  containers:
  - name: test
    image: busybox:1.37
    imagePullPolicy: IfNotPresent
    command: ["sleep", "infinity"]
    resources:
      requests:
        memory: "100Mi"
        cpu: "1"
      limits:
        memory: "100Mi"
        cpu: "1"
  nodeSelector:
    kubernetes.io/hostname: {{ HOST_PLACEHOLDER }}
