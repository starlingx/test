apiVersion: v1
kind: Pod
metadata:
  name: stress-ng
  labels:
    app: stress-ng
spec:
  # Pin to the host whose memory we sized against, so stress runs where we measured.
  nodeSelector:
    kubernetes.io/hostname: HOST_PLACEHOLDER
  # Tolerate all taints so the nodeSelector-pinned pod schedules onto the controller.
  tolerations:
  - operator: Exists
  containers:
  - name: stress-ng
    image: registry.local:9001/stress-ng
    imagePullPolicy: IfNotPresent
    args: ["--vm-bytes", "PLACEHOLDER", "--vm-keep", "-m", "1", "--timeout", "0"]
  imagePullSecrets:
  - name: local-secret
