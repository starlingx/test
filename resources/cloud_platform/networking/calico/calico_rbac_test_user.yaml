apiVersion: v1
kind: ServiceAccount
metadata:
  name: calico-rbac-test
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: calico-rbac-test
  namespace: default
rules:
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: calico-rbac-test
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: calico-rbac-test
subjects:
- kind: ServiceAccount
  name: calico-rbac-test
  namespace: default
