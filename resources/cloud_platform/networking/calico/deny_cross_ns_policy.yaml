# Allows ingress to every pod in ns-beta from every namespace except ns-alpha.
# Selecting the pods makes ingress deny-by-default, so traffic from ns-alpha is
# dropped while traffic from other namespaces keeps working.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-except-alpha
  namespace: ns-beta
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
          - ns-alpha
