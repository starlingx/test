apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-app-route
spec:
  parentRefs:
  - name: calico-gateway
  hostnames:
  - gateway-app.test
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: gateway-app
      port: 80
